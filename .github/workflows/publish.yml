name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Official npm trusted-publishing guide: do not cache release builds.
          package-manager-cache: false

      - name: Use npm with OIDC trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # npm OIDC authenticates only during `npm publish`. Publish shared first
      # so the three adapters can resolve `chat-adapter-cn-shared@^0.1.0`.
      # Skip versions that are already on the registry so a re-run is idempotent.
      - name: Publish packages
        run: |
          set -euo pipefail
          publish() {
            local name version
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on npm)"
              return
            fi
            echo "publish $name@$version"
            npm publish --access public
          }
          (cd packages/shared && publish)
          (cd packages/feishu && publish)
          (cd packages/wecom && publish)
          (cd packages/dingtalk && publish)
